name: CI

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Start Postgres (docker-compose)
        run: docker compose up -d db

      - name: Wait for Postgres
        env:
          POSTGRES_DB: dormitory_db
          POSTGRES_USER: dormitory_user
        run: |
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" && exit 0
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          docker compose logs db
          exit 1

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: dormitory_db
          POSTGRES_USER: dormitory_user
          POSTGRES_PASSWORD: dormitory_pass
        run: python manage.py migrate --noinput

      - name: Run backend tests
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: dormitory_db
          POSTGRES_USER: dormitory_user
          POSTGRES_PASSWORD: dormitory_pass
        run: python manage.py test

  frontend:
    name: Frontend (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run frontend tests
        run: cd frontend && npm run test:ci

      - name: Run Prettier check (scoped)
        run: cd frontend && npm run format:check

